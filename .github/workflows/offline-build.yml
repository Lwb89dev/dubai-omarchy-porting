# SPDX-License-Identifier: MIT
name: offline-build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: tests/static.sh
      - run: scripts/fetch-sources.sh
      - run: scripts/build-rootfs.sh --prepare-only

  kernel-initramfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # build-all applies kernel/patches on a pinned worktree before
      # compiling; the workflow must not bypass it, or CI would publish
      # an unpatched reference kernel.
      - run: BUILD_ROOTFS=0 JOBS=4 scripts/build-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dubai-offline-artifacts
          path: |
            out/kernel-llvm/arch/arm64/boot/Image*
            out/kernel-llvm/arch/arm64/boot/dts/qcom/sm7325-motorola-dubai-*.dtb
            out/kernel-llvm/config.final
            out/kernel-llvm/SHA256SUMS
            out/kernel-llvm/modules-*.tar.zst
            out/initramfs-llvm/initramfs-dubai.cpio.gz
            out/initramfs-llvm/SHA256SUMS
          if-no-files-found: error
