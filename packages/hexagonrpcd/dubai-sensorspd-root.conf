# SPDX-License-Identifier: MIT
# Dubai serves the SensorPD registry from the FairBlobs hexagonfs tree
# (provisioned at /usr/share/qcom/sm7325/Motorola/dubai, matching
# firmware-motorola-dubai on postmarketOS) instead of relying on path
# guessing over the read-only Android persist mount.
[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/sm7325/Motorola/dubai
