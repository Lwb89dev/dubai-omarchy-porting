[Unit]
Requires=omamobile-dubai-sensors-setup.service
After=omamobile-dubai-sensors-setup.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /var/lib/dubai-hexagonrpc
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
NoNewPrivileges=yes
ReadWritePaths=/var/lib/dubai-hexagonrpc/sensors/persist
