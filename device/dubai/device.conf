# RAM-only bring-up descriptor. No persistent installation is supported.
CODENAME=dubai
FASTBOOT_PRODUCT=dubai
NAME="Motorola Edge 30"
SOC=sm7325
COMPATIBLE="motorola,dubai"
PACKAGE=omamobile-device-dubai
BOOT_METHOD=ram-only
BOOT_IMAGES=""
UFS_RW=""
PANEL_SIZE=1080x2400
PANEL_VARIANT=csot
DTB_CSOT="qcom/sm7325-motorola-dubai-csot.dtb"
DTB_TIANMA="qcom/sm7325-motorola-dubai-tianma.dtb"
CMDLINE="earlycon console=ttyMSM0,115200n8 console=tty0 panic=10"
